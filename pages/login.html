<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SbayRean - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* CSS សម្រាប់រចនា Form */
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box; /* Important for width 100% */
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .toggle-text {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        .toggle-text a {
            color: #007bff;
            cursor: pointer;
            text-decoration: underline;
        }
        /* លាក់ Form Register ជាលំនាំដើម */
        #registerForm {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="loginForm">
        <h2>Login to SbayRean</h2>
        <div class="input-group">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" required>
        </div>
        <div class="input-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" required>
        </div>
        <button onclick="handleLogin()">Sign In</button>
        <p class="toggle-text">Don't have an account? <a onclick="toggleForms()">Register here</a></p>
    </div>

    <div id="registerForm">
        <h2>Create an Account</h2>
        <div class="input-group">
            <label for="regFirstName">First Name</label>
            <input type="text" id="regFirstName" required>
        </div>
        <div class="input-group">
            <label for="regLastName">Last Name</label>
            <input type="text" id="regLastName" required>
        </div>
        <div class="input-group">
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" required>
        </div>
        <div class="input-group">
            <label for="regPassword">Password</label>
            <input type="password" id="regPassword" required>
        </div>
        <button onclick="handleRegister()">Sign Up</button>
        <p class="toggle-text">Already have an account? <a onclick="toggleForms()">Login here</a></p>
    </div>
</div>

<script>
    // ==========================================
    // ១. មុខងារប្តូរផ្ទាំង qua មកវិញរវាង Login និង Register
    // ==========================================
    function toggleForms() {
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        
        if (loginForm.style.display === 'none') {
            loginForm.style.display = 'block';
            registerForm.style.display = 'none';
        } else {
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
        }
    }

    // ==========================================
    // ២. មុខងារបញ្ជូនទិន្នន័យ Register ទៅ Backend
    // ==========================================
    async function handleRegister() {
        // ចាប់យកតម្លៃ និងកាត់ចោលការដកឃ្លាដែលមិនចាំបាច់ (trim)
        const firstName = document.getElementById('regFirstName').value.trim();
        const lastName = document.getElementById('regLastName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;

        // ពិនិត្យមើលថាគាត់បានបំពេញគ្រប់ចន្លោះឬនៅ?
        if (!firstName || !lastName || !email || !password) {
            alert('សូមបំពេញព័ត៌មានឱ្យបានគ្រប់ជ្រុងជ្រោយ (Please fill in all fields).');
            return;
        }

        try {
            // ផ្ញើសំណើ (Request) ទៅកាន់ API
            const response = await fetch('http://localhost:5000/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ firstName, lastName, email, password })
            });

            const data = await response.json();
            
            // ប្រសិនបើចុះឈ្មោះជោគជ័យ
            if (response.ok) {
                alert('ការចុះឈ្មោះជោគជ័យ! សូមចូលគណនី។ (Registration successful!)');
                toggleForms(); // ប្តូរទៅផ្ទាំង Login វិញដោយស្វ័យប្រវត្តិ
                document.getElementById('loginEmail').value = email; // វាយបញ្ចូល Email ឱ្យគាត់ស្រាប់ៗ
            } else {
                // ប្រសិនបើមានបញ្ហា (ឧ. អ៊ីមែលជាន់គ្នា)
                alert(data.message);
            }
        } catch (error) {
            console.error('Registration error:', error);
            alert('មិនអាចតភ្ជាប់ទៅកាន់ Server បានទេ! សូមឆែកមើល Server របស់អ្នក។');
        }
    }

    // ==========================================
    // ៣. មុខងារបញ្ជូនទិន្នន័យ Login ទៅ Backend
    // ==========================================
    async function handleLogin() {
        // ចាប់យកតម្លៃ និងកាត់ចោលការដកឃ្លាដែលមិនចាំបាច់
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (!email || !password) {
            alert('សូមបញ្ចូលអ៊ីមែល និងលេខសម្ងាត់របស់អ្នក (Please enter your email and password).');
            return;
        }

        try {
            // ផ្ញើសំណើ (Request) ទៅកាន់ API
            const response = await fetch('http://localhost:5000/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            // ប្រសិនបើ Login ជោគជ័យ
            if (response.ok) {
                alert('ចូលគណនីទទួលបានជោគជ័យ! (Login successful!)');
                
                // រក្សាទុកទិន្នន័យ User ទៅក្នុង Browser (Local Storage) ដើម្បីឱ្យទំព័រផ្សេងៗទៀតអាចស្គាល់គាត់
                localStorage.setItem('currentUser', JSON.stringify(data.user));

                // 🔴 ចំណុចសំខាន់៖ ចាប់យក Role ពីទិន្នន័យដែល Backend ផ្ញើមក។ 
                // បើគ្មានបញ្ជាក់ទេ ដាក់វាជា 'user' ធម្មតាជាលំនាំដើម
                const userRole = data.user.role || 'user'; 
                
                // ==========================================
                // ៤. កំណត់ការបញ្ជូនទំព័រ (Redirect) តាមសិទ្ធិ (Role)
                // ==========================================
                if (userRole === 'superadmin') {
                    // បញ្ជូនទៅកាន់ Dashboard របស់ Super Admin
                    window.location.href = 'superadmin/dashboard.html';
                } else if (userRole === 'admin') {
                    // បញ្ជូនទៅកាន់ Dashboard របស់ Admin ធម្មតា
                    window.location.href = 'admin/manage-users.html';
                } else {
                    // បញ្ជូនទៅកាន់ Dashboard របស់ User ធម្មតា
                    window.location.href = 'dashboard.html'; 
                }
            } else {
                // ប្រសិនបើខុសលេខសម្ងាត់ ឬរកមិនឃើញគណនី
                alert(data.message);
            }
        } catch (error) {
            console.error('Login error:', error);
            alert('មិនអាចតភ្ជាប់ទៅកាន់ Server បានទេ! សូមប្រាកដថា Server កំពុងដំណើរការ។');
        }
    }
</script>

</body>
</html>
