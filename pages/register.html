<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – SbayRean</title>
    <link rel="icon" type="image/png" href="../img/logoweb.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0b0c10;
            color: #f1f5f9;
            font-family: 'DM Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background: #18181b;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 32px;
            width: 100%;
            max-width: 440px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .close-btn {
            position: absolute;
            top: 28px;
            right: 28px;
            background: #27272a;
            border: none;
            color: #a1a1aa;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: #3f3f46;
            color: #ffffff;
        }

        /* Sliding Tab Navigation */
        .auth-toggle {
            display: inline-flex;
            background: #09090b;
            padding: 4px;
            border-radius: 9999px;
            margin-bottom: 32px;
        }

        .toggle-tab {
            padding: 8px 20px;
            font-size: 14px;
            font-weight: 500;
            color: #71717a;
            text-decoration: none;
            border-radius: 9999px;
            transition: all 0.2s;
        }

        .toggle-tab.active {
            background: #27272a;
            color: #ffffff;
        }

        .auth-card h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 24px;
            color: #ffffff;
        }

        /* Form Controls */
        .form-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 12px;
            flex: 1;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: #242427;
            border: 1px solid transparent;
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }

        .form-group input::placeholder {
            color: #52525b;
        }

        .form-group input:focus {
            border-color: rgba(255, 255, 255, 0.2);
            background: #27272a;
        }

        /* Custom Phone Input Styling */
        .phone-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .phone-prefix {
            position: absolute;
            left: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #a1a1aa;
            font-size: 14px;
            cursor: pointer;
        }

        .phone-prefix img {
            width: 20px;
            height: 14px;
            object-fit: cover;
            border-radius: 2px;
        }

        .phone-input-wrapper input {
            padding-left: 64px;
        }

        /* Buttons */
        .btn-submit {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: opacity 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        /* Social Section */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
            color: #52525b;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .divider span {
            padding: 0 12px;
        }

        .social-row {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn-social {
            flex: 1;
            padding: 12px;
            background: #242427;
            border: 1px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .btn-social:hover {
            background: #27272a;
            border-color: rgba(255, 255, 255, 0.1);
        }

        .btn-social svg {
            width: 20px;
            height: 20px;
        }

        .auth-footer {
            text-align: center;
            font-size: 13px;
            color: #71717a;
        }

        .auth-footer a {
            color: #a1a1aa;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <button class="close-btn" aria-label="Close">✕</button>

        <div class="auth-toggle">
            <a href="#" class="toggle-tab active">Sign up</a>
            <a href="login.html" class="toggle-tab">Sign in</a>
        </div>

        <h2>Create an account</h2>

        <form action="#" method="POST">
            <div class="form-row">
                <div class="form-group">
                    <input type="text" id="firstname" placeholder="First name" required>
                </div>
                <div class="form-group">
                    <input type="text" id="lastname" placeholder="Last name" required>
                </div>
            </div>

            <div class="form-group">
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group phone-input-wrapper">
                <div class="phone-prefix">
                    <img src="https://flagcdn.com/w20/us.png" alt="US Flag">
                    <span>▼</span>
                </div>
                <input type="tel" id="phone" placeholder="(775) 351-6501">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <div class="form-group">
                    <input type="password" id="confirm-password" placeholder="Confirm" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">Create an account</button>
        </form>

        <div class="divider">
            <span>OR SIGN IN WITH</span>
        </div>

        <div class="social-row">
            <button type="button" class="btn-social" aria-label="Sign in with Google">
                <svg viewBox="0 0 24 24">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4" />
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853" />
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05" />
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335" />
                </svg>
            </button>
            <button type="button" class="btn-social" aria-label="Sign in with Apple">
                <svg viewBox="0 0 24 24" fill="#ffffff">
                    <path d="M17.057 10.422c-.035-2.52 2.057-3.731 2.152-3.794-1.173-1.714-3.003-1.947-3.649-1.993-1.554-.157-3.042.92-3.83 1.04-.787.119-2.03-.831-3.336-.805-1.713.025-3.3.997-4.181 2.529-1.787 3.093-.458 7.669 1.272 10.165.847 1.22 1.847 2.585 3.167 2.535 1.273-.05 1.754-.819 3.292-.819 1.537 0 1.97.819 3.293.793 1.346-.025 2.221-1.243 3.062-2.472.973-1.422 1.374-2.8 1.397-2.87-.03-.013-2.686-1.026-2.714-4.103zm-2.434-6.852c.691-.841 1.157-2.006.929-3.17-1.002.04-2.215.666-2.934 1.506-.644.744-1.207 1.927-.954 3.067 1.116.086 2.267-.563 2.959-1.403z"/>
                </svg>
            </button>
        </div>

        <div class="auth-footer">
            By creating an account, you agree to our <a href="#">Terms & Service</a>
        </div>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', function (event) {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // ១. ឆែកមើលថាតើ Password តិចជាង ៨ ខ្ទង់ឬទេ?
            if (password.length < 8) {
                event.preventDefault(); 
                alert("លេខសម្ងាត់ (Password) ត្រូវមានយ៉ាងហោចណាស់ ៨ ខ្ទង់ឡើងទៅ!");
                return; 
            }

            // ២. ឆែកមើលថាតើ Password ទាំងពីរដូចគ្នាឬទេ?
            if (password !== confirmPassword) {
                event.preventDefault();
                alert("លេខសម្ងាត់ទាំងពីរមិនដូចគ្នាទេ សូមវាយបញ្ចូលម្តងទៀត!");
                return;
            }
        });
    </script>
</body>
</html>
