<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Assistant - SbayRean</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background-color: #1e293b;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .chat-header {
            background-color: #0f172a;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 1px solid #334155;
            color: #2dd4bf;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 8px;
            line-height: 1.4;
            font-size: 0.95rem;
        }
        .user-message {
            background-color: #0ea5e9;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }
        .ai-message {
            background-color: #334155;
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 0;
        }
        .chat-input-area {
            padding: 15px;
            background-color: #0f172a;
            display: flex;
            gap: 10px;
            border-top: 1px solid #334155;
        }
        .chat-input {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: white;
            outline: none;
        }
        .chat-input:focus {
            border-color: #2dd4bf;
        }
        .send-btn {
            background-color: #2dd4bf;
            color: #0f172a;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .send-btn:hover {
            background-color: #14b8a6;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🤖 AI Chat Assistant</div>
    <div class="chat-messages" id="chatMessages">
        <div class="message ai-message">សួស្តីប្អូន! ខ្ញុំជា AI Assistant តើមានអ្វីឱ្យខ្ញុំជួយប្អូននៅថ្ងៃនេះទេ?</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="chatInput" class="chat-input" placeholder="វាយសារនៅទីនេះ..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">ផ្ញើ</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputElement = document.getElementById('chatInput');
        const messageText = inputElement.value.trim();
        if (!messageText) return;

        const chatMessages = document.getElementById('chatMessages');

        // ១. បង្ហាញសាររបស់ User លើអេក្រង់
        const userDiv = document.createElement('div');
        userDiv.className = 'message user-message';
        userDiv.textContent = messageText;
        chatMessages.appendChild(userDiv);
        
        // សម្អាតប្រអប់វាយសារ
        inputElement.value = '';
        chatMessages.scrollTop = chatMessages.scrollHeight;

        // ២. បង្ហាញសញ្ញាកំពុងគិត (Loading...)
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'message ai-message';
        loadingDiv.textContent = 'កំពុងគិត...🤖';
        chatMessages.appendChild(loadingDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try {
            // ៣. ផ្ញើសារទៅកាន់ Node.js Back-End Server (Port 5000)
            const response = await fetch('http://localhost:5000/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: messageText })
            });

            const data = await response.json();
            
            // ៤. យកចម្លើយពី Server មកជំនួសពាក្យ Loading
            loadingDiv.textContent = data.reply;

        } catch (error) {
            loadingDiv.textContent = 'សុំទោសផង មានបញ្ហាក្នុងការតភ្ជាប់ទៅកាន់ Server!';
            console.error(error);
        }
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
</script>

</body>
</html>
