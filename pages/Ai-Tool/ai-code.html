<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Code Helper – SbayRean</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0b0d11;
      --surface:  #13161e;
      --panel:    #0f1117;
      --border:   #1f2335;
      --accent:   #5ef0b4;
      --accent2:  #7c6af7;
      --text:     #e8eaf2;
      --muted:    #5a6275;
      --radius:   12px;
      --font-mono:'Space Mono', monospace;
      --font-body:'DM Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      gap: 12px;
    }
    .logo-link { text-decoration: none; }
    .logo-text  { font-family: var(--font-mono); font-size: 18px; color: var(--accent2); letter-spacing: -0.5px; }
    .header-title { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
    .header-title span { color: var(--text); font-weight: 500; }
    .btn-outline {
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 7px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      text-decoration: none;
      transition: all .2s;
      white-space: nowrap;
    }
    .btn-outline:hover { border-color: var(--accent2); color: var(--accent2); }

    /* ── Main two-column layout ── */
    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr;
      gap: 0;
      overflow: hidden;
      height: calc(100dvh - 57px);
    }

    /* ── Left pane ── */
    .pane-left {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    .pane-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .pane-label {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    /* language selector */
    .lang-select {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 5px 10px;
      cursor: pointer;
      outline: none;
    }
    .lang-select option { background: #1a1d26; }

    /* prompt area */
    .prompt-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 18px;
      gap: 14px;
      overflow-y: auto;
    }

    .example-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 13px;
      font-size: 12px;
      cursor: pointer;
      color: var(--text);
      transition: all .2s;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); }

    #promptInput {
      flex: 1;
      min-height: 160px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      padding: 14px;
      resize: none;
      outline: none;
      line-height: 1.6;
      transition: border-color .2s;
    }
    #promptInput::placeholder { color: var(--muted); }
    #promptInput:focus { border-color: var(--accent2); }

    .generate-btn {
      background: linear-gradient(135deg, var(--accent2), #4f46e5);
      border: none;
      border-radius: var(--radius);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 14px;
      padding: 13px;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .generate-btn:hover  { opacity: .88; }
    .generate-btn:active { transform: scale(.97); }
    .generate-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ── Right pane ── */
    .pane-right {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pane-right .pane-header { justify-content: space-between; }

    .code-actions { display: flex; gap: 8px; align-items: center; }

    .action-btn {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 5px 11px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: none;
      color: var(--muted);
      cursor: pointer;
      transition: all .2s;
    }
    .action-btn:hover { border-color: var(--accent); color: var(--accent); }

    #codeOutput {
      flex: 1;
      overflow: auto;
      padding: 20px;
      font-family: var(--font-mono);
      font-size: 13.5px;
      line-height: 1.7;
      color: #c9d1d9;
      background: var(--panel);
      white-space: pre-wrap;
      word-break: break-word;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .placeholder-code {
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      text-align: center;
      font-size: 14px;
    }
    .placeholder-code .icon { font-size: 48px; }

    /* syntax coloring (simple) */
    .kw  { color: #c792ea; }
    .str { color: #c3e88d; }
    .fn  { color: #82aaff; }
    .cm  { color: #546e7a; font-style: italic; }
    .num { color: #f78c6c; }

    /* status bar */
    .status-bar {
      padding: 6px 18px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .status-ok  { color: var(--accent); }
    .status-err { color: #f87171; }

    /* loading spinner */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    .generate-btn.loading .spinner { display: block; }
    .generate-btn.loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 700px) {
      .workspace { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; overflow: visible; }
      .pane-left { border-right: none; border-bottom: 1px solid var(--border); min-height: 320px; }
      .pane-right { height: 50dvh; }
    }
  </style>
</head>
<body>

<header>
  <a href="../index.html" class="logo-link"><span class="logo-text">SbayRean</span></a>
  <div class="header-title">💻 <span>AI Code Helper</span></div>
  <a href="../ai-tools.html" class="btn-outline">← Back</a>
</header>

<div class="workspace">

  <!-- LEFT: prompt -->
  <div class="pane-left">
    <div class="pane-header">
      <span class="pane-label">Your Prompt</span>
      <select class="lang-select" id="langSelect">
        <option value="HTML">HTML</option>
        <option value="CSS">CSS</option>
        <option value="JavaScript">JavaScript</option>
        <option value="Python">Python</option>
        <option value="PHP">PHP</option>
        <option value="SQL">SQL</option>
        <option value="TypeScript">TypeScript</option>
        <option value="React">React (JSX)</option>
      </select>
    </div>
    <div class="prompt-area">
      <div class="example-chips">
        <div class="chip" onclick="usePrompt('A responsive navigation bar with hamburger menu')">Nav bar</div>
        <div class="chip" onclick="usePrompt('A dark modal popup with blur overlay')">Modal popup</div>
        <div class="chip" onclick="usePrompt('A CSS card hover animation with shadow')">Card hover</div>
        <div class="chip" onclick="usePrompt('Fetch API data and display in a table')">Fetch API</div>
        <div class="chip" onclick="usePrompt('A Python function to read a CSV file with pandas')">CSV reader</div>
      </div>
      <textarea id="promptInput" placeholder="Describe the code you want to generate…&#10;&#10;Example: A responsive login form with HTML and CSS using a dark theme"></textarea>
      <button class="generate-btn" id="generateBtn" onclick="generateCode()">
        <div class="spinner"></div>
        <span class="btn-text">✨ Generate Code</span>
      </button>
    </div>
  </div>

  <!-- RIGHT: output -->
  <div class="pane-right">
    <div class="pane-header">
      <span class="pane-label">Generated Code</span>
      <div class="code-actions">
        <button class="action-btn" onclick="copyCode()">📋 Copy</button>
        <button class="action-btn" onclick="clearCode()">🗑 Clear</button>
      </div>
    </div>
    <div id="codeOutput">
      <div class="placeholder-code">
        <div class="icon">💻</div>
        <p>Your generated code will appear here.</p>
        <p style="font-size:12px; color: #3a3f50;">Describe what you need → hit Generate</p>
      </div>
    </div>
    <div class="status-bar">
      <span id="statusMsg">Ready</span>
      <span id="lineCount">—</span>
    </div>
  </div>

</div>

<script>
  function usePrompt(text) {
    document.getElementById('promptInput').value = text;
    document.getElementById('promptInput').focus();
  }

  async function generateCode() {
    const prompt = document.getElementById('promptInput').value.trim();
    const lang   = document.getElementById('langSelect').value;
    const btn    = document.getElementById('generateBtn');
    const output = document.getElementById('codeOutput');
    const status = document.getElementById('statusMsg');
    const lines  = document.getElementById('lineCount');

    if (!prompt) {
      document.getElementById('promptInput').focus();
      return;
    }

    btn.classList.add('loading');
    btn.disabled = true;
    status.textContent = 'Generating…';
    status.className = '';
    output.innerHTML = '<div class="placeholder-code"><div class="icon" style="animation:spin 1s linear infinite;display:inline-block">⚙️</div><p>Generating code…</p></div>';

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          system: `You are an expert ${lang} developer. The user will describe code they want. Return ONLY the raw code with no markdown fences, no explanation before or after. Just the code itself, production-ready and well-commented.`,
          messages: [{ role: 'user', content: `Write ${lang} code for: ${prompt}` }]
        })
      });

      const data  = await res.json();
      const code  = data?.content?.[0]?.text || '// No code generated.';
      const safe  = escHtml(code);
      output.textContent = ''; // clear
      output.innerHTML = safe;

      const lineN = code.split('\n').length;
      lines.textContent = `${lineN} lines`;
      status.textContent = '✓ Done';
      status.className = 'status-ok';

    } catch (err) {
      output.innerHTML = '<div class="placeholder-code"><p class="status-err">⚠️ Error generating code. Please try again.</p></div>';
      status.textContent = 'Error';
      status.className = 'status-err';
    } finally {
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  }

  function copyCode() {
    const text = document.getElementById('codeOutput').textContent.trim();
    if (!text || text.includes('generated code will appear')) return;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.querySelector('.action-btn');
      const old = btn.textContent;
      btn.textContent = '✅ Copied!';
      setTimeout(() => btn.textContent = old, 1800);
    });
  }

  function clearCode() {
    document.getElementById('codeOutput').innerHTML =
      '<div class="placeholder-code"><div class="icon">💻</div><p>Your generated code will appear here.</p></div>';
    document.getElementById('statusMsg').textContent = 'Ready';
    document.getElementById('statusMsg').className = '';
    document.getElementById('lineCount').textContent = '—';
    document.getElementById('promptInput').value = '';
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  document.getElementById('promptInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.ctrlKey) generateCode();
  });
</script>
</body>
</html>
